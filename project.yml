name: VexorPhone
options:
  bundleIdPrefix: uz.qosimjon
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VexorPhone:
    type: application
    platform: iOS
    sources:
      - VexorPhone
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: VEXOR Phone
        UILaunchScreen: {}
        NSFaceIDUsageDescription: VEXOR Phone uses Face ID to confirm that it is you.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.qosimjon.vexorphone
